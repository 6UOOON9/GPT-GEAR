[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GPT-GEAR"
version = "0.2.0"
description = "Codex control for unmodified simulation benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT AND Apache-2.0"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.29.1", "pillow"]
test = ["pytest", "numpy", "pillow", "omegaconf", "scipy", "PyYAML"]

[project.scripts]
gpt-gear = "execution.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
environments = ["*/prompts/*.md", "tasks.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
