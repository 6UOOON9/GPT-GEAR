name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mcp,test]'
      - run: python -m pytest -q
      - run: gpt-gear --help
      - run: gpt-gear reference annotate --help
      - run: gpt-gear reference prepare --help
  simulation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_runtime.py
